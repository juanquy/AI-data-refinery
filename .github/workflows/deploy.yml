name: Deploy

# Every push to main deploys the worker to the `staging` wrangler environment.
# Production deploys only when a person runs this workflow by hand from the
# Actions tab (workflow_dispatch) on main, and passes the `production`
# environment's protection rules (set required reviewers in repo settings).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  staging:
    name: deploy staging
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations (staging)
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply refinery-db-staging --env staging --remote
      - name: Deploy worker (staging)
        working-directory: apps/worker
        run: npx wrangler deploy --env staging

  production:
    name: deploy production (manual)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations (production)
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply refinery-db --remote
      - name: Deploy worker (production)
        working-directory: apps/worker
        run: npx wrangler deploy
      # The Studio UI (apps/web) on Cloudflare Pages stays a manual deploy.
      # To automate it, set the Pages project name and uncomment:
      # - run: npm run build -w apps/web
      # - run: npx wrangler pages deploy apps/web/dist --project-name TODO_PAGES_PROJECT
